# @package _global_

defaults:
  - override /model: Llama-2-7b-hf-local
  - override /trainer: GradAscent
  - override /data: unlearn
  - override /data/datasets@data.forget: MUSE_forget
  - override /data/datasets@data.retain: MUSE_retain
  - override /eval: muse

data_split: News
forget_split: forget
retain_split: retain1
retain_logs_path: null

data:
  anchor: forget
  forget:
    MUSE_forget:
      args:
        hf_args:
          split: ${forget_split}
          path: ${oc.env:DATASET_PATH,/data/datasets}/MUSE-${data_split}
        max_length: 512 # 2048
  retain:
    MUSE_retain:
      args:
        hf_args:
          path: ${oc.env:DATASET_PATH,/data/datasets}/MUSE-${data_split}
          split: ${retain_split}
        max_length: 512 # 2048

eval:
  muse:
    data_split: ${data_split}
    retain_logs_path: ${retain_logs_path}
    overwrite: true

trainer:
  args:
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 4
    learning_rate: 1e-5
    num_train_epochs: 5
    lr_scheduler_type: constant
    gradient_checkpointing: true
    ddp_find_unused_parameters: false
    do_eval: false
    eval_on_start: false

model:
  model_args:
    attn_implementation: eager
    
task_name: ???
